<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3558">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voyana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Voyana 5.0</title>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="brand">
    <div>
      <h1>🧭 Voyana</h1>
      <div id="tagline" class="tagline"></div>
    </div>
    <div class="version">5.0</div>
  </div>
  <div class="lang">
    <button data-lang="pl">PL</button>
    <button data-lang="en">EN</button>
    <button data-lang="es">ES</button>
  </div>
</header>

<section class="card">
  <label id="promptLabel"></label>
  <textarea id="query"></textarea>
  <div class="chips">
    <button class="chip" data-example="Turcja na 10 dni we wrześniu">Turcja • 10 dni</button>
    <button class="chip" data-example="Filipiny na 16 dni w październiku">Filipiny • 16 dni</button>
    <button class="chip" data-example="Hiszpania na 7 dni w maju do £500">Hiszpania • £500</button>
  </div>
  <button id="analyse" class="secondary"></button>
</section>

<section id="parsedCard" class="card hidden">
  <h3 id="parsedTitle"></h3>
  <div class="parsed">
    <div class="pill">🌍<b id="parsedDestination"></b></div>
    <div class="pill">📅<b id="parsedMonth"></b></div>
    <div class="pill">🗓️<b id="parsedDays"></b></div>
    <div class="pill">💷<b id="parsedBudget"></b></div>
    <div class="pill">👤<b id="parsedAdults"></b></div>
  </div>
</section>

<section class="card">
  <label id="startLabel"></label>
  <select id="home">
    <option value="newcastle">Newcastle</option>
  </select>

  <label id="destinationLabel"></label>
  <select id="destination">
    <option value="AYT">Antalya</option>
    <option value="IST">Stambuł</option>
    <option value="WAW">Warszawa</option>
    <option value="KRK">Kraków</option>
    <option value="GDN">Gdańsk</option>
    <option value="MNL">Manila</option>
    <option value="CEB">Cebu</option>
    <option value="PPS">Puerto Princesa</option>
    <option value="AGP">Malaga</option>
    <option value="ALC">Alicante</option>
    <option value="BCN">Barcelona</option>
    <option value="HND">Tokio</option>
  </select>

  <div class="grid">
    <div><label id="departLabel"></label><input id="depart" type="date"></div>
    <div><label id="returnLabel"></label><input id="returnDate" type="date"></div>
  </div>

  <div class="grid">
    <div><label id="adultsLabel"></label><input id="adults" type="number" min="1" max="9" value="1"></div>
    <div>
      <label id="cabinLabel"></label>
      <select id="cabin">
        <option value="economy">Economy</option>
        <option value="premium_economy">Premium Economy</option>
        <option value="business">Business</option>
        <option value="first">First</option>
      </select>
    </div>
  </div>

  <button id="compare"></button>
</section>

<div id="status" class="card status hidden"></div>
<div id="notice" class="card notice hidden"></div>
<div id="error" class="card error hidden"></div>
<div id="results"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
