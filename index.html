<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3558">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voyana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/main.css">
<title>Voyana v3.0</title>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div>
      <h1>🧭 Voyana</h1>
      <div class="subtitle" data-i18n="subtitle">Plan the journey, not just the flight.</div>
    </div>
    <div class="version">v3.0</div>
  </div>
  <div class="language-switcher">
    <button data-lang="pl">PL</button>
    <button data-lang="en">EN</button>
    <button data-lang="es">ES</button>
  </div>
</header>

<main>
  <section class="card">
    <label data-i18n="home">Home city</label>
    <select id="home">
      <option value="newcastle">Newcastle</option>
    </select>

    <label data-i18n="destination">Destination</label>
    <select id="destination"></select>

    <div class="grid">
      <div>
        <label data-i18n="departure">Departure date</label>
        <input id="depart" type="date">
      </div>
      <div>
        <label data-i18n="return">Return date</label>
        <input id="returnDate" type="date">
      </div>
    </div>

    <div class="grid">
      <div>
        <label data-i18n="adults">Adults</label>
        <input id="adults" type="number" min="1" max="9" value="1">
      </div>
      <div>
        <label data-i18n="cabin">Cabin class</label>
        <select id="cabin">
          <option value="economy">Economy</option>
          <option value="premium_economy">Premium Economy</option>
          <option value="business">Business</option>
          <option value="first">First</option>
        </select>
      </div>
    </div>

    <button id="compare" data-i18n="compare">Compare airports</button>
  </section>

  <section id="status" class="card status hidden"></section>
  <section id="error" class="card error hidden"></section>
  <section id="notice" class="card notice hidden"></section>
  <section id="recommendation" class="card recommendation hidden"></section>
  <section id="summary" class="card hidden"></section>
  <section id="results"></section>

  <section class="card small" data-i18n="testNote">
    Duffel Test Mode may return test data rather than full live market content.
  </section>
</main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
