<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3558">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voyana">
<link rel="manifest" href="manifest.webmanifest">
<title>Voyana v2.2</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#172634;background:#eef4f8
}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.app{max-width:900px;margin:auto}
header{
  background:linear-gradient(135deg,#0b3558,#176985);
  color:white;padding:24px;border-radius:0 0 28px 28px;
  box-shadow:0 8px 24px rgba(11,53,88,.18)
}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:31px;margin:0}
.subtitle{font-size:16px;margin-top:5px;opacity:.9}
.version{margin-left:auto;background:#ffffff22;padding:7px 11px;border-radius:999px;font-size:13px}
.card,.airport-card{
  background:white;padding:18px;margin:14px 0;border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06)
}
label{display:block;font-weight:800;margin:13px 0 7px;font-size:17px}
input,select{
  width:100%;padding:14px;border:1px solid #b8c9d5;border-radius:13px;
  font-size:17px;background:white;color:#172634
}
button{
  width:100%;padding:14px;border:0;border-radius:13px;font-size:16px;
  font-weight:850;margin-top:14px;background:#0b3558;color:white;cursor:pointer
}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none}
.status{background:#fff7d6;border:1px solid #efd46f}
.error{background:#ffe9e9;border:1px solid #e2a1a1}
.notice{background:#edf4ff;border:1px solid #aac2df}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f1f6f9;border-radius:14px;padding:13px;text-align:center}
.stat b{display:block;color:#0b3558;font-size:23px}
.recommendation{background:#eaf7ed;border:1px solid #8dc89d}
.airport-card{border:1px solid #d8e3ea;cursor:pointer}
.airport-card.best{border:2px solid #4a9f68;background:#f2faf4}
.offer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.price{font-size:31px;font-weight:900;color:#0b3558;margin:7px 0}
.badge{
  display:inline-block;background:#edf3f6;border-radius:999px;
  padding:6px 9px;font-size:12px;margin:3px 3px 3px 0
}
.badge.green{background:#ddf3e3;color:#225e32}
.badge.amber{background:#fff0c9;color:#755107}
.chevron{font-size:27px;transition:.2s}
.airport-card.open .chevron{transform:rotate(180deg)}
.details{display:none;margin-top:14px}
.airport-card.open .details{display:block}
.slice{
  border-top:1px solid #dfe8ed;padding-top:13px;margin-top:13px
}
.slice-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.segment{
  background:#f5f8fa;border-radius:13px;padding:12px;margin-top:10px
}
.route{font-size:18px;font-weight:850;color:#0b3558}
.times{margin-top:5px}
.layover{
  margin:8px 0 0;padding:9px;background:#fff3cf;border-radius:10px;
  font-size:13px;color:#68520e
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.actions button{margin:0}
.buy{background:#1c7b42}
.buy.disabled{background:#89969d}
.small{font-size:13px;color:#62727f;line-height:1.5}
.airport-name{font-size:20px;font-weight:850}
@media(max-width:640px){
  .grid,.summary,.actions{grid-template-columns:1fr}
  .brand h1{font-size:28px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div>
      <h1>🧭 Voyana</h1>
      <div class="subtitle">Smart Compare + przesiadki</div>
    </div>
    <div class="version">v2.2</div>
  </div>
</header>

<div class="card">
  <label>Miasto startowe</label>
  <select id="home">
    <option value="newcastle">Newcastle</option>
  </select>

  <label>Dokąd chcesz lecieć?</label>
  <select id="destination">
    <option value="AYT">Antalya</option>
    <option value="IST">Stambuł</option>
    <option value="WAW">Warszawa</option>
    <option value="KRK">Kraków</option>
    <option value="GDN">Gdańsk</option>
    <option value="MNL">Manila</option>
    <option value="CEB">Cebu</option>
    <option value="PPS">Puerto Princesa</option>
    <option value="AGP">Malaga</option>
    <option value="ALC">Alicante</option>
    <option value="BCN">Barcelona</option>
  </select>

  <div class="grid">
    <div>
      <label>Data wylotu</label>
      <input id="depart" type="date">
    </div>
    <div>
      <label>Data powrotu</label>
      <input id="returnDate" type="date">
    </div>
  </div>

  <div class="grid">
    <div>
      <label>Dorośli</label>
      <input id="adults" type="number" min="1" max="9" value="1">
    </div>
    <div>
      <label>Klasa</label>
      <select id="cabin">
        <option value="economy">Economy</option>
        <option value="premium_economy">Premium Economy</option>
        <option value="business">Business</option>
        <option value="first">First</option>
      </select>
    </div>
  </div>

  <button id="compare">Porównaj lotniska</button>
</div>

<div id="status" class="card status hidden"></div>
<div id="error" class="card error hidden"></div>
<div id="notice" class="card notice hidden"></div>
<div id="recommendation" class="card recommendation hidden"></div>
<div id="summary" class="card hidden"></div>
<div id="results"></div>

<div class="card small">
  Wyniki pochodzą z Duffel Test Mode. Trasy, ceny i linie mogą być testowe. 
  Prawdziwy zakup biletu zostanie aktywowany po przejściu konta Duffel do Live Mode.
</div>
</div>

<script>
const API='https://voyana-api.fcczaplin.workers.dev/smart-compare';
const $=id=>document.getElementById(id);

const airportGroups={
  newcastle:['NCL','MAN','EDI','LBA','BHX','LHR','LGW']
};

const airportNames={
  NCL:'Newcastle',
  MAN:'Manchester',
  EDI:'Edinburgh',
  LBA:'Leeds Bradford',
  BHX:'Birmingham',
  LHR:'London Heathrow',
  LGW:'London Gatwick'
};

const iso=date=>date.toISOString().slice(0,10);
let departDate=new Date();
departDate.setDate(departDate.getDate()+30);
let returnDate=new Date(departDate);
returnDate.setDate(returnDate.getDate()+10);
$('depart').value=iso(departDate);
$('returnDate').value=iso(returnDate);

function formatDate(value){
  if(!value) return '—';
  return new Date(value).toLocaleString('pl-PL',{
    dateStyle:'medium',
    timeStyle:'short'
  });
}

function formatMoney(currency,amount){
  const number=Number(amount);
  return `${currency || ''} ${Number.isFinite(number) ? number.toFixed(2) : amount}`;
}

function connectionLabel(count){
  if(count===0) return 'Lot bezpośredni';
  if(count===1) return '1 przesiadka';
  return `${count} przesiadki`;
}

function renderSegments(slice){
  let html='';
  (slice.segments||[]).forEach((segment,index)=>{
    html+=`
      <div class="segment">
        <div class="route">${segment.origin} → ${segment.destination}</div>
        <div class="times">
          ${formatDate(segment.departing_at)}<br>
          ${formatDate(segment.arriving_at)}
        </div>
        <div class="small">
          ${segment.marketing_carrier||'Linia lotnicza'}
          ${segment.flight_number ? ' • '+segment.flight_number : ''}
          ${segment.aircraft ? ' • '+segment.aircraft : ''}
        </div>
        ${segment.operating_carrier && segment.operating_carrier!==segment.marketing_carrier
          ? `<div class="small">Operowany przez: ${segment.operating_carrier}</div>`
          : ''}
        ${segment.layover_airport
          ? `<div class="layover">⏳ Przesiadka na ${segment.layover_airport}: ${segment.layover_after||'czas nieznany'}</div>`
          : ''}
      </div>`;
  });
  return html;
}

function renderSlice(slice,index){
  const connectionAirports=(slice.connection_airports||[])
    .map(item=>`${item.airport} (${item.duration||'—'})`)
    .join(', ');

  return `
    <div class="slice">
      <div class="slice-title">
        <div>
          <b>${index===0?'Wylot':'Powrót'}: ${slice.origin} → ${slice.destination}</b>
          <div class="small">
            ${connectionLabel(slice.connections)}
            ${slice.elapsed_duration ? ' • '+slice.elapsed_duration : ''}
          </div>
        </div>
      </div>
      ${connectionAirports
        ? `<div class="layover">Lotniska przesiadek: ${connectionAirports}</div>`
        : ''}
      ${renderSegments(slice)}
    </div>`;
}

function render(data){
  const results=$('results');
  results.innerHTML='';

  const rows=(data.cheapest_by_airport||[])
    .filter(row=>row.cheapest_offer)
    .sort((a,b)=>a.cheapest_offer.total_amount-b.cheapest_offer.total_amount);

  if(!rows.length){
    results.innerHTML='<div class="card">Brak ofert dla wybranych parametrów.</div>';
    return;
  }

  const best=rows[0];
  const homeOffer=rows.find(row=>row.origin==='NCL');

  let recommendation=`Najtańszy lot znaleziono z lotniska ${airportNames[best.origin]||best.origin} za ${formatMoney(best.cheapest_offer.total_currency,best.cheapest_offer.total_amount)}.`;
  if(homeOffer && best.origin!=='NCL'){
    const saving=homeOffer.cheapest_offer.total_amount-best.cheapest_offer.total_amount;
    if(saving>0){
      recommendation+=` Sam bilet jest tańszy o ${formatMoney(best.cheapest_offer.total_currency,saving)} niż lot z Newcastle.`;
    }
  }
  recommendation+=' Koszt dojazdu i parking dodamy w następnym etapie.';
  $('recommendation').textContent=recommendation;
  $('recommendation').classList.remove('hidden');

  $('summary').innerHTML=`
    <div class="summary">
      <div class="stat"><b>${data.compared_airports||0}</b><span>lotnisk sprawdzonych</span></div>
      <div class="stat"><b>${data.successful_airports||0}</b><span>lotnisk z ofertami</span></div>
      <div class="stat"><b>${rows.length}</b><span>najtańszych ofert</span></div>
    </div>`;
  $('summary').classList.remove('hidden');

  rows.forEach((row,index)=>{
    const offer=row.cheapest_offer;
    const card=document.createElement('div');
    card.className='airport-card'+(index===0?' best':'');
    card.tabIndex=0;

    const totalConnections=(offer.slices||[])
      .reduce((sum,slice)=>sum+(slice.connections||0),0);

    const allSlices=(offer.slices||[])
      .map((slice,sliceIndex)=>renderSlice(slice,sliceIndex))
      .join('');

    card.innerHTML=`
      <div class="offer-head">
        <div>
          <div class="airport-name">
            ${index===0?'⭐ Najtańsza opcja — ':''}${airportNames[row.origin]||row.origin}
          </div>
          <span class="badge">${row.origin}</span>
          <span class="badge">${offer.airline||'Linia lotnicza'}</span>
          <span class="badge ${totalConnections===0?'green':'amber'}">${connectionLabel(totalConnections)}</span>
          <div class="price">${formatMoney(offer.total_currency,offer.total_amount)}</div>
          <div class="small">Kliknij, aby zobaczyć pełną trasę i przesiadki.</div>
        </div>
        <div class="chevron">⌄</div>
      </div>

      <div class="details">
        ${allSlices}
        <div class="actions">
          <button class="buy ${offer.booking_available?'':'disabled'}" ${offer.booking_available?'':'disabled'}>
            ${offer.booking_available?'Kup bilet':'Kupno niedostępne w Test Mode'}
          </button>
          <button class="save-btn">Zapisz ofertę</button>
        </div>
      </div>`;

    const toggle=event=>{
      if(event.target.closest('button')) return;
      card.classList.toggle('open');
    };
    card.addEventListener('click',toggle);
    card.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        card.classList.toggle('open');
      }
    });

    card.querySelector('.save-btn').addEventListener('click',event=>{
      event.stopPropagation();
      const saved=JSON.parse(localStorage.getItem('voyanaSavedOffers')||'[]');
      saved.unshift({
        origin:row.origin,
        destination:$('destination').value,
        airline:offer.airline,
        amount:offer.total_amount,
        currency:offer.total_currency,
        saved_at:new Date().toISOString()
      });
      localStorage.setItem('voyanaSavedOffers',JSON.stringify(saved.slice(0,20)));
      alert('Oferta została zapisana na tym urządzeniu.');
    });

    results.appendChild(card);
  });
}

$('compare').addEventListener('click',async()=>{
  $('error').classList.add('hidden');
  $('notice').classList.add('hidden');
  $('recommendation').classList.add('hidden');
  $('summary').classList.add('hidden');
  $('results').innerHTML='';
  $('status').textContent='Voyana porównuje lotniska i analizuje przesiadki…';
  $('status').classList.remove('hidden');
  $('compare').disabled=true;

  try{
    const response=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        origins:airportGroups[$('home').value],
        destination:$('destination').value,
        departure_date:$('depart').value,
        return_date:$('returnDate').value||null,
        adults:Number($('adults').value)||1,
        cabin_class:$('cabin').value
      })
    });

    const data=await response.json();
    if(!response.ok){
      throw new Error(data.error||data.message||'Błąd API');
    }

    $('status').textContent=`Porównano ${data.compared_airports||0} lotnisk.`;
    if(data.test_mode){
      $('notice').textContent='Tryb testowy: wyniki służą do sprawdzania działania aplikacji i mogą nie odzwierciedlać rzeczywistych rozkładów.';
      $('notice').classList.remove('hidden');
    }
    render(data);
  }catch(error){
    $('status').classList.add('hidden');
    $('error').textContent='Błąd: '+error.message;
    $('error').classList.remove('hidden');
  }finally{
    $('compare').disabled=false;
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
