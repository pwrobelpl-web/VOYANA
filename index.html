<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3558"><link rel="manifest" href="manifest.webmanifest"><title>Voyana v1.3</title>
<style>body{font-family:Arial,sans-serif;background:#eef4f8;margin:0;padding:14px;color:#162531}.app{max-width:800px;margin:auto}header{background:#0b3558;color:#fff;padding:20px;border-radius:0 0 20px 20px}.card,.offer{background:#fff;padding:16px;margin:12px 0;border-radius:16px;box-shadow:0 4px 14px #0001}label{display:block;font-weight:bold;margin-top:10px}input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #bbc8d0;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:bold;margin-top:10px;background:#0b3558;color:white}.secondary{background:#e8f0f4;color:#0b3558}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.status{background:#fff7d6}.error{background:#ffe7e7}.price{font-size:28px;font-weight:bold;color:#0b3558}.segment{border-top:1px solid #ddd;padding-top:8px;margin-top:8px}.small{font-size:12px;color:#60717c}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="app"><header><h1>🧭 Voyana v1.3</h1><div>Prawdziwe wyszukiwanie przez Voyana API</div></header>
<div class="card"><label>Opisz podróż</label><textarea id="natural" placeholder="Np. Polska we wrześniu na 14 dni"></textarea><button class="secondary" id="fill">Rozpoznaj i uzupełnij pola</button>
<div class="grid"><div><label>Wylot</label><input id="origin" value="NCL" maxlength="3"></div><div><label>Cel</label><input id="destination" value="WAW" maxlength="3"></div></div>
<div class="grid"><div><label>Data wylotu</label><input id="depart" type="date"></div><div><label>Data powrotu</label><input id="returnDate" type="date"></div></div>
<div class="grid"><div><label>Dorośli</label><input id="adults" type="number" min="1" max="9" value="1"></div><div><label>Klasa</label><select id="cabin"><option value="economy">Economy</option><option value="premium_economy">Premium Economy</option><option value="business">Business</option><option value="first">First</option></select></div></div>
<button id="search">Szukaj lotów w Voyanie</button></div>
<div id="status" class="card status hidden"></div><div id="error" class="card error hidden"></div><div id="results"></div>
<div class="card small">Duffel Test Mode może zwracać dane testowe, a nie pełne ceny produkcyjne.</div></div>
<script>
const API='https://voyana-api.fcczaplin.workers.dev/search', $=i=>document.getElementById(i);
const D=[['polska','WAW'],['warszawa','WAW'],['kraków','KRK'],['krakow','KRK'],['gdańsk','GDN'],['gdansk','GDN'],['filipiny','MNL'],['manila','MNL'],['cebu','CEB'],['puerto princesa','PPS'],['palawan','PPS'],['hiszpania','AGP'],['malaga','AGP'],['alicante','ALC'],['barcelona','BCN'],['japonia','HND'],['tokio','HND']];
const M={'styczeń':0,'luty':1,'marzec':2,'kwiecień':3,'maj':4,'czerwiec':5,'lipiec':6,'sierpień':7,'wrzesień':8,'październik':9,'listopad':10,'grudzień':11};
const iso=d=>d.toISOString().slice(0,10);
let d=new Date();d.setDate(d.getDate()+30);let r=new Date(d);r.setDate(r.getDate()+14);$('depart').value=iso(d);$('returnDate').value=iso(r);
$('fill').onclick=()=>{let t=$('natural').value.toLowerCase();for(const [k,v] of D)if(t.includes(k)){$('destination').value=v;break}let month=null;for(const k in M)if(t.includes(k)){month=M[k];break}let days=14,m=t.match(/(\d{1,3})\s*(dni|dzień|dnia)/);if(m)days=+m[1];if(month!==null){let n=new Date(),y=n.getFullYear();if(month<n.getMonth())y++;let dep=new Date(y,month,8),ret=new Date(dep);ret.setDate(ret.getDate()+days);$('depart').value=iso(dep);$('returnDate').value=iso(ret)}};
function fmt(s){return s?new Date(s).toLocaleString('pl-PL',{dateStyle:'medium',timeStyle:'short'}):'—'}
function render(data){$('results').innerHTML='';if(!data.offers||!data.offers.length){$('results').innerHTML='<div class="card">Brak ofert dla tych parametrów.</div>';return}data.offers.forEach((o,i)=>{let x=document.createElement('div');x.className='offer';let s='';for(const sl of o.slices||[])s+=`<div class="segment"><b>${sl.origin} → ${sl.destination}</b><br>${fmt(sl.departure_at)} – ${fmt(sl.arrival_at)}<br>${sl.connections} przesiadek • ${sl.duration||''}</div>`;x.innerHTML=`<h3>${i===0?'⭐ Najtańsza oferta':'✈️ Oferta '+(i+1)}</h3><div>${o.airline||''}</div><div class="price">${o.total_currency} ${o.total_amount}</div>${s}`;$('results').appendChild(x)})}
$('search').onclick=async()=>{$('error').classList.add('hidden');$('results').innerHTML='';$('status').textContent='Voyana pobiera oferty…';$('status').classList.remove('hidden');let p={origin:$('origin').value.trim().toUpperCase(),destination:$('destination').value.trim().toUpperCase(),departure_date:$('depart').value,return_date:$('returnDate').value||null,adults:+$('adults').value||1,cabin_class:$('cabin').value};try{let res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),data=await res.json();if(!res.ok)throw new Error(data.error||data.message||'Błąd API');$('status').textContent='Znaleziono '+(data.results_count||0)+' ofert.';render(data)}catch(e){$('status').classList.add('hidden');$('error').textContent='Błąd: '+e.message;$('error').classList.remove('hidden')}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
